<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm your signup</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
  <div style="text-align: center; margin-bottom: 24px;">
    <img src="{{ .SiteURL }}/NewLogo.jpg" alt="Prepsuite.ai" style="max-width: 200px; height: auto;" />
  </div>
  <h2 style="color: #1e293b;">Confirm your signup</h2>
  <p>Thanks for signing up for Prepsuite.ai! Follow this link to confirm your email address:</p>
  <p><a href="{{ .ConfirmationURL }}" style="display: inline-block; background: #6366f1; color: white; padding: 12px 24px; text-decoration: none; border-radius: 8px; font-weight: 500;">Confirm your email</a></p>
  <p style="color: #64748b; font-size: 14px;">Or copy and paste this link: {{ .ConfirmationURL }}</p>
  <p style="color: #64748b; font-size: 14px;">If you didn't sign up, you can safely ignore this email.</p>
</body>
</html>
