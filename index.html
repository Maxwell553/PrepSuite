<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0f172a">
    <style>
      html{color-scheme:only dark}
      html,body{margin:0;background-color:#0f172a;color:#e8e8e8}
      .boot-shell{min-height:100vh;display:grid;place-items:center;background:#080b16}
      .boot-mark{font:700 28px system-ui;color:#b7a5ff;border:1px solid #534675;border-radius:16px;padding:16px 24px}
      .seo-shell{max-width:1000px;margin:auto;padding:48px 24px;font:18px/1.7 system-ui;color:#f5f3fb}.seo-shell h1{font-size:48px;line-height:1.1}.seo-shell a{color:#c5b0ff}.seo-shell nav{margin-top:32px}
    </style>
    <script>(function(){var h=document.documentElement;h.classList.add('dark');h.style.colorScheme='dark'})();</script>
    <!--public-head:start--><!--public-head:end-->
    <link rel="icon" href="/prepsuite-shield.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=TASA+Orbiter:wght@400..800&amp;family=Geist+Mono:wght@400..700&amp;display=swap">
    <link rel="stylesheet" href="/src/index.css">
    <!-- Stub gtag (queues events); load gtag.js after window.load so discovery of LCP image is not delayed by script in the first KB of head -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.gtag = gtag;
      window.addEventListener('load', function () {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=AW-18020973445';
        s.onload = function () {
          gtag('js', new Date());
          gtag('config', 'AW-18020973445');
        };
        document.head.appendChild(s);
      });
    </script>
</head>
<body>
    <div id="root"><!--public-content:start--><div class="boot-shell" role="status">Loading PrepSuite…</div><!--public-content:end--></div>
    <script type="module" src="/src/index.tsx"></script>
</body>
</html>
