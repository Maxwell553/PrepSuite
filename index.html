      <main id="prepsuite-content" role="main" style="max-width: 720px; margin: 2rem auto; padding: 2rem; font-family: system-ui, sans-serif; line-height: 1.6; color: #f1f5f9;">
        <article>
          <header>
            <h1>PrepSuite — AI-Powered Chess Opponent Scouting</h1>
            <p>Master your opponent analysis. Bridge the gap between tournament and online play.</p>
          </header>
          <section aria-labelledby="what-is">
            <h2 id="what-is">What is PrepSuite?</h2>
            <p>PrepSuite is an AI-powered chess scouting platform that aggregates player data from Chess.com, Lichess, FIDE, and USCF, then generates comprehensive analysis reports. Search any opponent by FIDE ID, USCF ID, Chess.com username, or Lichess username.</p>
          </section>
          <section aria-labelledby="features">
            <h2 id="features">Features</h2>
            <ul>
              <li>AI-powered identity resolution — discovers Chess.com and Lichess usernames from FIDE and USCF IDs</li>
              <li>Multi-source game aggregation — up to 2,500 games from Chess.com, Lichess, and OTB tournament databases</li>
              <li>Stockfish engine analysis — every game analyzed at depth 10–12 for tactical patterns and mistakes</li>
              <li>Opening repertoire breakdown — visual charts showing win/draw/loss rates for each opening</li>
              <li>AI strategic reports — Google Gemini generates strengths, weaknesses, and preparation recommendations</li>
              <li>Tournament data integration — works with FIDE (international) and USCF (US) tournament data</li>
            </ul>
          </section>
          <section aria-labelledby="benefits">
            <h2 id="benefits">Why Tournament Players Choose PrepSuite</h2>
            <ul>
              <li>Automatically links tournament identities to online accounts</li>
              <li>Analyzes games from Chess.com, Lichess, and OTB databases</li>
              <li>Stockfish identifies tactical weaknesses</li>
              <li>Visual opening performance charts</li>
              <li>AI-generated actionable preparation recommendations</li>
              <li>Save and manage multiple scouting reports</li>
            </ul>
          </section>
          <section aria-labelledby="get-started">

            <p>Visit <a href="https://prepsuite.ai">prepsuite.ai</a> and enable JavaScript to use the full application. Free to get started, no credit card required.</p>
