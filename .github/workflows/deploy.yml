name: Deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        required: true
        default: staging
        type: choice
        options: [staging, production]
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      # Each GitHub environment supplies its own Supabase/GCP values.
      # Apply additive schema changes before code starts using the new RPCs.
      - name: Apply database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          npx supabase link --project-ref "$PROJECT_REF"
          npx supabase db push --linked
      - name: Deploy functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          npx supabase functions deploy health --project-ref "$PROJECT_REF"
          npx supabase functions deploy delete-user --project-ref "$PROJECT_REF"
          npx supabase functions deploy stripe-webhook --no-verify-jwt --project-ref "$PROJECT_REF"
      - name: Build and deploy combined frontend and pipeline
        env:
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
        run: |
          test -n "$PROJECT" && test -n "$SERVICE" && test -n "$SUPABASE_URL" && test -n "$SUPABASE_ANON_KEY"
          gcloud builds submit . --project="$PROJECT" --config=cloudbuild.yaml --substitutions="_SERVICE_NAME=$SERVICE,_VITE_SUPABASE_URL=$SUPABASE_URL,_VITE_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
